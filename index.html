<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bengkel Opi Motor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
  
  <div class="bg-white p-8 rounded-lg shadow-xl w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Bengkel Opi Motor</h2>
    
    <div id="error-alert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" id="username" required class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-semibold">Masuk</button>
    </form>

    <div class="mt-4 text-center">
      <button id="reset-two-fa-btn" class="text-sm text-blue-600 hover:underline">Reset 2FA</button>
    </div>
  </div>

  <!-- Modal 2FA -->
  <div id="two-fa-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-80">
      <h3 class="text-lg font-bold mb-4">Verifikasi 2FA Keamanan</h3>
      <form id="two-fa-form">
        <input type="text" id="two-fa-code" placeholder="Masukkan Kode 2FA" required class="w-full px-3 py-2 border rounded mb-4">
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded">Verifikasi</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
