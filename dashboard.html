<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Bengkel Opi Motor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="app-wallpaper" class="bg-cover bg-center min-h-screen">
  
  <div class="bg-black bg-opacity-60 min-h-screen text-white">
    <!-- Navbar -->
    <nav class="bg-gray-900 shadow-md p-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <img id="brand-logo" src="" alt="Logo" class="h-10 w-10 rounded-full object-cover">
        <h1 class="text-xl font-bold">Bengkel Opi Motor</h1>
      </div>
      <div>
        <span id="working-hours-display" class="text-sm bg-gray-800 px-3 py-1 rounded"></span>
        <button onclick="localStorage.clear(); window.location.href='index.html';" class="ml-4 bg-red-600 px-3 py-1 rounded text-sm hover:bg-red-700">Keluar</button>
      </div>
    </nav>

    <!-- Content Area -->
    <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Panel Stok Barang & Upload Gambar -->
      <div class="bg-white text-gray-800 p-6 rounded-lg shadow">
        <h3 class="text-lg font-bold mb-4">Manajemen Stok Barang & Spare Part</h3>
        <form id="part-form" class="space-y-3 mb-6">
          <input type="text" id="part-name" placeholder="Nama Barang" required class="w-full p-2 border rounded">
          <input type="text" id="part-category" placeholder="Kategori" required class="w-full p-2 border rounded">
          <input type="number" id="part-price" placeholder="Harga" required class="w-full p-2 border rounded">
          <input type="number" id="part-stock" placeholder="Jumlah Stok" required class="w-full p-2 border rounded">
          <input type="file" id="part-image" class="w-full p-1 border rounded">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Simpan Barang</button>
        </form>

        <div id="spare-parts-grid" class="grid grid-cols-2 gap-4 max-h-64 overflow-y-auto"></div>
      </div>

      <!-- Panel Admin (Pengaturan & Manajemen User) -->
      <div id="admin-panel" class="bg-white text-gray-800 p-6 rounded-lg shadow">
        <h3 class="text-lg font-bold mb-4">Pengaturan & Otoritas Admin</h3>
        
        <!-- Form Pengaturan Logo, Wallpaper, Jam -->
        <form id="settings-form" class="space-y-3 mb-6 border-b pb-4">
          <label class="block text-sm font-semibold">Jam Operasional</label>
          <input type="text" id="working-hours-input" class="w-full p-2 border rounded">
          
          <label class="block text-sm font-semibold">Ganti Logo Bengkel</label>
          <input type="file" id="logo-file" class="w-full p-1 border rounded">
          <input type="hidden" id="current-logo">

          <label class="block text-sm font-semibold">Ganti Wallpaper Background</label>
          <input type="file" id="wallpaper-file" class="w-full p-1 border rounded">
          <input type="hidden" id="current-wallpaper">

          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded w-full">Perbarui Pengaturan</button>
        </form>

        <!-- Tambah & Hapus User -->
        <h4 class="font-bold mb-2">Manajemen User Kasir/Staff</h4>
        <form id="add-user-form" class="flex space-x-2 mb-4">
          <input type="text" id="new-username" placeholder="Username" required class="p-2 border rounded w-1/3">
          <input type="password" id="new-password" placeholder="Password" required class="p-2 border rounded w-1/3">
          <select id="new-role" class="p-2 border rounded w-1/4">
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
          <button type="submit" class="bg-green-600 text-white px-3 py-2 rounded">+</button>
        </form>

        <div id="user-list-container" class="max-h-40 overflow-y-auto"></div>
      </div>

    </div>
  </div>

  <!-- Area Cetak Invoice Tersembunyi -->
  <div id="printable-invoice" class="hidden">
    <h2>INVOICE BENGKEL OPI MOTOR</h2>
    <p>No: <span id="inv-number"></span></p>
    <p>Pelanggan: <span id="inv-customer"></span></p>
    <p>Tanggal: <span id="inv-date"></span></p>
    <table>
      <thead><tr><th>Item</th><th>Qty</th><th>Harga</th></tr></thead>
      <tbody id="inv-items"></tbody>
    </table>
    <h3>Total: Rp <span id="inv-total"></span></h3>
  </div>

  <script type="module">
    import { initAdminPanel } from './js/admin.js';
    import { initWorkshop } from './js/workshop.js';

    document.addEventListener('DOMContentLoaded', () => {
      initAdminPanel();
      initWorkshop();
    });
  </script>
</body>
</html>
